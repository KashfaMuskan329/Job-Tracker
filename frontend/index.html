<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#4f46e5; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:20px; text-align:center; }
  header h1 { margin:0; font-size:24px; }
  main { max-width:820px; margin:24px auto; padding:0 16px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:13px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; display:grid; grid-template-columns:1fr 1fr 150px auto; gap:10px; margin-bottom:20px; }
  input, select, button { padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  button { background:var(--primary); color:#fff; border:none; cursor:pointer; }
  .job { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .job .info { flex:1; }
  .job .info b { font-size:16px; }
  .job .info div { color:var(--muted); font-size:13px; }
  .del { background:#ef4444; padding:8px 12px; }
  .empty { text-align:center; color:var(--muted); padding:30px; }
  @media (max-width:640px) { form { grid-template-columns:1fr; } .stats { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<header><h1>Job Application Tracker</h1></header>
<main>
  <div class="stats" id="stats"></div>
  <form id="form">
    <input id="company" placeholder="Company" required>
    <input id="role" placeholder="Role" required>
    <select id="status">
      <option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option>
    </select>
    <button type="submit">Add</button>
  </form>
  <div id="list"></div>
</main>
<script>
const STATUSES = ["Applied", "Interview", "Offer", "Rejected"];
const $ = (id) => document.getElementById(id);

async function load() {
  const jobs = await (await fetch("/api/jobs")).json();
  $("stats").innerHTML = STATUSES.map(s =>
    `<div class="stat"><b>${jobs.filter(j => j.status === s).length}</b><span>${s}</span></div>`).join("");
  $("list").innerHTML = jobs.length ? jobs.map(j => `
    <div class="job">
      <div class="info"><b>${esc(j.role)}</b><div>${esc(j.company)} · ${new Date(j.createdAt).toLocaleDateString()}</div></div>
      <select onchange="setStatus('${j._id}', this.value)">
        ${STATUSES.map(s => `<option ${s === j.status ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <button class="del" onclick="del('${j._id}')">Delete</button>
    </div>`).join("") : '<div class="empty">No applications yet. Add your first one above.</div>';
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await fetch("/api/jobs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ company: $("company").value, role: $("role").value, status: $("status").value }),
  });
  e.target.reset();
  load();
});

async function setStatus(id, status) {
  await fetch("/api/jobs/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
  load();
}
async function del(id) { await fetch("/api/jobs/" + id, { method: "DELETE" }); load(); }

load();
</script>
</body>
</html>
